<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>To‑Do — Local Storage App</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#5b21b6">
  <link rel="icon" href="/icons/icon-192.svg" />
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>To‑Do List</h1>

    <form id="todo-form" class="todo-form" autocomplete="off">
      <input id="todo-input" type="text" placeholder="Add a new task" aria-label="Add a new task" />
      <button type="submit">Add</button>
    </form>

    <div class="controls">
      <div class="filters">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="completed">Completed</button>
      </div>
      <button id="clear-completed" class="danger">Clear completed</button>
    </div>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <footer class="footer">
      <span id="task-count">0 tasks</span>
    </footer>
  </main>

  <script src="main.js"></script>
  <script>
    // Register service worker for PWA functionality
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/service-worker.js')
        .then(reg => console.log('Service worker registered', reg.scope))
        .catch(err => console.warn('Service worker registration failed', err));
    }

    // Prompt flow: show beforeinstallprompt event to let user add to home screen
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      // Optionally show UI to user to trigger install prompt
      // For this simple app we'll show a console hint
      console.log('PWA can be installed: show install prompt manually with deferredPrompt.prompt()');
    });
  </script>
</body>
</html>
